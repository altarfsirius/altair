<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALTAIR Engineering</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--surface:#fff;--ink:#14202b;--muted:#5b6b7a;--line:#dde3ea;
  --brand:#0b5cab;--brand-ink:#fff;--ok:#1b7f4b;--ok-bg:#e4f4ec;--warn:#9a5b00;--warn-bg:#fff2dc;
  --bad:#b3261e;--bad-bg:#fde8e6;--info:#0b5cab;--info-bg:#e5effa;--na:#6b7785;--na-bg:#eef1f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px;font-weight:650}
header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:58px;z-index:4;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--muted);padding:9px 12px;font:inherit;font-weight:550;
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:16px}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:15.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:550;min-width:150px;flex:1}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
button.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 12px;min-height:40px;cursor:pointer}
button.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:10px;background:var(--na-bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .25s}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:650;display:inline-block}
.p-required{background:var(--info-bg);color:var(--info)}.p-optional{background:var(--na-bg);color:var(--na)}
.p-completed{background:var(--ok-bg);color:var(--ok)}.p-blocked{background:var(--warn-bg);color:var(--warn)}
.p-overdue{background:var(--bad-bg);color:var(--bad)}.p-not_applicable{background:var(--na-bg);color:var(--na)}
.p-exception{background:var(--warn-bg);color:var(--warn)}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;background:var(--surface)}
.step.na{opacity:.65}.step.focus{outline:2px solid var(--brand)}
.step h3{margin:0;font-size:14.5px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.step .why{margin:6px 0 0;font-size:13px}
.step .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;background:var(--na-bg);color:var(--na);border-radius:6px;padding:2px 7px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.nba{background:var(--info-bg);border-color:transparent}
.now{border-left:4px solid var(--accent,#1a56db);font-size:15px}
.warn{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;border-left:5px solid}
.warn.blocking{background:var(--bad-bg);border-color:var(--bad)}
.warn.warning{background:var(--warn-bg);border-color:var(--warn)}
.warn.info{background:var(--info-bg);border-color:var(--info)}
.warn b{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.dot.ok{background:var(--ok-bg);color:var(--ok)}.dot.no{background:var(--bad-bg);color:var(--bad)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;min-width:220px;flex-direction:row}
.toggle input{width:20px;height:20px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.help-btn{border:1px solid var(--line);background:var(--bg);color:var(--brand);width:22px;height:22px;border-radius:50%;font-weight:700;cursor:pointer;line-height:1;padding:0}
.fh{display:none;background:var(--info-bg);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12.5px;color:var(--ink)}
.fh.open{display:block}
details.card summary{cursor:pointer;font-weight:650}
.banner{font-size:12.5px;background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px}
@media (max-width:560px){main{padding:12px}label{min-width:100%}.toggle{min-width:100%}}

header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-r select{min-height:38px;width:auto;max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--muted);font-size:12.5px}
.rec{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.grp{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.cons{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;margin:6px 0}
.appr{background:var(--info-bg);border-radius:8px;padding:6px 10px;margin:6px 0}
.lnk{border:0;background:none;cursor:pointer;font-size:15px;padding:2px 6px}
.fb{margin-top:8px}
.gl h4{margin:14px 0 4px;font-size:13.5px}.gl p,.gl ul{margin:4px 0}.gl ul{padding-left:20px}
textarea{resize:vertical}
.lb{display:flex;gap:6px;align-items:center}
header{position:static}
nav{top:0}
button.btn.danger{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div><h1>ALTAIR Engineering</h1><p>Aviation asset, sourcing &amp; engineering management · built-in Process Guidance</p></div>
  <div class="hdr-r"><label style="min-width:0;flex:none;flex-direction:row;align-items:center;gap:6px">User <select id="userSel" aria-label="Acting user"></select></label>
  <button class="btn" id="resetAll">Reset demo</button></div>
</header>
<nav role="tablist" id="tabs"></nav>
<main>
<div class="banner">Standalone demo: data is stored in this browser only. Production access control is enforced by the database (see the SQL migration), not by this page.</div>
<div id="view"></div>
</main>
