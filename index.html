<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altair Aero Engineering</title>
<meta name="app-version" content="1.25.0">
<meta name="theme-color" content="#0d2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Altair Aero">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--surface:#fff;--ink:#14202b;--muted:#5b6b7a;--line:#dde3ea;
  --brand:#0b5cab;--brand-ink:#fff;--ok:#1b7f4b;--ok-bg:#e4f4ec;--warn:#9a5b00;--warn-bg:#fff2dc;
  --bad:#b3261e;--bad-bg:#fde8e6;--info:#0b5cab;--info-bg:#e5effa;--na:#6b7785;--na-bg:#eef1f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px;font-weight:650}
header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:58px;z-index:4;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--muted);padding:9px 12px;font:inherit;font-weight:550;
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:16px}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:15.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:550;min-width:150px;flex:1}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
button.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 12px;min-height:40px;cursor:pointer}
button.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:10px;background:var(--na-bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .25s}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:650;display:inline-block}
.p-required{background:var(--info-bg);color:var(--info)}.p-optional{background:var(--na-bg);color:var(--na)}
.p-completed{background:var(--ok-bg);color:var(--ok)}.p-blocked{background:var(--warn-bg);color:var(--warn)}
.p-overdue{background:var(--bad-bg);color:var(--bad)}.p-not_applicable{background:var(--na-bg);color:var(--na)}
.p-exception{background:var(--warn-bg);color:var(--warn)}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;background:var(--surface)}
.step.na{opacity:.65}.step.focus{outline:2px solid var(--brand)}
.step h3{margin:0;font-size:14.5px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.step .why{margin:6px 0 0;font-size:13px}
.step .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;background:var(--na-bg);color:var(--na);border-radius:6px;padding:2px 7px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.nba{background:var(--info-bg);border-color:transparent}
.now{border-left:4px solid var(--accent,#1a56db);font-size:15px}
.warn{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;border-left:5px solid}
.warn.blocking{background:var(--bad-bg);border-color:var(--bad)}
.warn.warning{background:var(--warn-bg);border-color:var(--warn)}
.warn.info{background:var(--info-bg);border-color:var(--info)}
.warn b{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.dot.ok{background:var(--ok-bg);color:var(--ok)}.dot.no{background:var(--bad-bg);color:var(--bad)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;min-width:220px;flex-direction:row}
.toggle input{width:20px;height:20px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.help-btn{border:1px solid var(--line);background:var(--bg);color:var(--brand);width:22px;height:22px;border-radius:50%;font-weight:700;cursor:pointer;line-height:1;padding:0}
.fh{display:none;background:var(--info-bg);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12.5px;color:var(--ink)}
.fh.open{display:block}
details.card summary{cursor:pointer;font-weight:650}
.banner{font-size:12.5px;background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px}
@media (max-width:560px){main{padding:12px}label{min-width:100%}.toggle{min-width:100%}}

header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-r select{min-height:38px;width:auto;max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:24px;line-height:1.2}.stat span{color:var(--muted);font-size:12.5px}
.rec{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.grp{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.cons{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;margin:6px 0}
.appr{background:var(--info-bg);border-radius:8px;padding:6px 10px;margin:6px 0}
.lnk{border:0;background:none;cursor:pointer;font-size:15px;padding:2px 6px}
.fb{margin-top:8px}
.gl h4{margin:14px 0 4px;font-size:13.5px}.gl p,.gl ul{margin:4px 0}.gl ul{padding-left:20px}
textarea{resize:vertical}
.lb{display:flex;gap:6px;align-items:center}
header{position:static}
nav{top:0}
button.btn.danger{color:var(--bad)}

/* shell */
#shell{display:flex;min-height:100vh;background:#fff}
#side{width:272px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#side .brand{padding:16px 16px 10px}#side .brand b{display:block;font-size:17px}#side .brand span{color:var(--muted);font-size:12px}
#menu{padding:6px 8px;flex:1}
.mg{margin-bottom:2px}
.mh{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;font:inherit;font-weight:650;color:var(--ink);cursor:pointer;text-align:left}
.mh:hover{background:var(--na-bg)}.mh i{font-style:normal;color:var(--muted);transition:transform .15s}.mg.open .mh i{transform:rotate(180deg)}
.mi{display:none;padding:2px 0 6px 10px;border-left:2px solid var(--line);margin-left:14px}.mg.open .mi{display:block}
.mit{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
.mit:hover{background:var(--na-bg);color:var(--ink)}.mit.sh{display:flex;justify-content:space-between;align-items:center;font-weight:650}
.mit.sh i{font-style:normal;transition:transform .15s}
.sg.open .mit.sh i{transform:rotate(180deg)}
.si{display:none;padding:0 0 4px 8px;border-left:1px solid var(--line);margin-left:10px}
.sg.open .si{display:block}
.mit.on{background:var(--info-bg);color:var(--brand);font-weight:650}
.mit em{font-style:normal;font-size:10.5px;background:var(--na-bg);color:var(--na);border-radius:999px;padding:1px 7px;margin-left:4px}
#who{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:13px}#who span{color:var(--muted);font-size:12px;margin-bottom:6px}
#content{flex:1;min-width:0}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
#menuBtn{display:none}
.startwrap{max-width:560px;margin:0 auto;padding:28px 16px}.startbrand h1{margin:0;font-size:24px}.startbrand p{margin:2px 0 16px;color:var(--muted)}
@media (max-width:820px){
  #side{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
  body.menu-open #side{transform:none}
  #menuBtn{display:inline-block}
}

/* ===== visual refresh (v1.5.1) ===== */
:root{--bg:#f3f6fa;--navy:#0d2440;--navy2:#143a66;--accent:#0b5cab;--shadow:0 1px 2px rgba(13,36,64,.06),0 4px 14px rgba(13,36,64,.06)}
body{background:var(--bg)}
[hidden]{display:none !important}
input[type=password],input[type=email],input[type=number],input[type=url],input[type=date],input[type=datetime-local],input[type=file]{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
select,input[type=text],textarea{background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc3ee;outline-offset:0;border-color:var(--accent)}
.card{box-shadow:var(--shadow);border-color:#e3e9f0;border-radius:14px;padding:18px}
.card h2{font-size:17px;letter-spacing:-.01em}
button.btn{border-radius:9px;transition:background .12s,box-shadow .12s}
button.btn:hover:not(:disabled){background:#eef3f9}
button.btn.primary:hover:not(:disabled){background:#094d90}
button.btn.primary{box-shadow:0 1px 2px rgba(11,92,171,.35)}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#f7f9fc}
tr:hover td{background:#fafcff}

/* sidebar (dark) — also neutralises the old top-tab <nav> rules that squashed the menu */
#shell{background:var(--bg)}
#side{background:linear-gradient(180deg,var(--navy),#0a1c33);border-right:0;width:268px;color:#dbe6f3}
#side .brand{padding:20px 18px 14px;display:flex;gap:12px;align-items:center}
#side .brand::before{content:"A";flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b8bdc,#0b5cab);color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#side .brand b{color:#fff;font-size:16px;letter-spacing:.02em}
#side .brand span{color:#8fa8c4;font-size:11.5px;line-height:1.3;display:block}
#side .brand div{min-width:0}
nav#menu{display:block;position:static;overflow:visible;padding:6px 10px;background:none;border:0;flex:1}
#menu button{border-bottom:0;white-space:normal;flex:none}
.mh{color:#eaf1f9;padding:10px 12px;font-size:13.5px}
.mh:hover{background:rgba(255,255,255,.08)}
.mh i{color:#7e97b5}
.mh .ic{width:22px;display:inline-block;opacity:.9}
.mg.open>.mh{color:#fff}
.mi{border-left:1px solid rgba(255,255,255,.14);margin-left:21px;padding:2px 0 8px 8px}
.mit{color:#a8bdd6;padding:7px 10px;font-size:13px;line-height:1.35}
.mit:hover{background:rgba(255,255,255,.08);color:#fff}
.mit.on{background:rgba(59,139,220,.28);color:#fff;font-weight:650}
.mit em{background:rgba(255,255,255,.12);color:#c9d8ea}
#who{border-top:1px solid rgba(255,255,255,.12);color:#fff;padding:14px 16px}
#who span{color:#8fa8c4}
#who button.btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
#who button.btn:hover{background:rgba(255,255,255,.16)}
.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid #e3e9f0;padding:14px 24px}
#crumb{font-size:14px}
main{max-width:1060px;padding:22px 24px}

/* dashboard tiles */
.grid{gap:14px;margin-bottom:16px}
.stat{padding:16px 12px;border-top:4px solid var(--accent);border-radius:12px}
.stat:nth-child(2){border-top-color:#1b7f4b}.stat:nth-child(3){border-top-color:#c27a00}.stat:nth-child(4){border-top-color:#b3261e}
.stat b{font-size:30px;color:var(--navy)}
.stat span{display:block;margin-top:2px}
.welcome,.card.welcome{background:linear-gradient(120deg,#0d2440,#1b5da3);color:#fff;border:0}
.card.welcome h2{color:#fff}.card.welcome p{color:#d5e4f5}

/* start / sign-in screen */
#start{min-height:100vh;background:radial-gradient(1200px 500px at 50% -10%,#1b5da3 0,#0d2440 60%,#0a1c33 100%)}
.startwrap{max-width:460px;padding:56px 18px 40px}
.startbrand{text-align:center;color:#fff;margin-bottom:22px}
.startbrand::before{content:"A";display:grid;place-items:center;width:58px;height:58px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#4a9be6,#0b5cab);font-weight:800;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.startbrand h1{font-size:28px;letter-spacing:.01em}
.startbrand p{color:#b6cae1;margin:6px auto 0;max-width:380px;font-size:14px}
#startBody .card{border:0;box-shadow:0 10px 30px rgba(0,0,0,.28)}
#startBody>p.small,#startBody .small.muted:not(.card *){color:#b6cae1}
#startBody .row{gap:12px}
#startBody .row label{min-width:100%}
#startBody button.btn.primary{width:100%;min-height:44px;margin-top:4px}
#startBody .card:last-child select{min-height:44px}
@media (max-width:820px){#side{width:285px}main{padding:16px}.topbar{padding:10px 14px}}

/* ===== branding (v1.8) ===== */
:root{--hdr-laptop:url(header-laptop.jpg);--hdr-phone:url(header-phone.jpg)}
.hero{height:118px;background:var(--hdr-laptop) center/cover no-repeat;border-bottom:1px solid #e3e9f0}
#side .brand::before{content:"";background:url(logo-128.png) center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.35);border-radius:10px;width:40px;height:40px}
.startbrand::before{content:"";background:url(logo-180.png) center/cover no-repeat;border-radius:18px;width:72px;height:72px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:0}
#start .hero{height:130px;border-bottom:0}
.tb-logo{display:none;width:30px;height:30px;border-radius:8px}
@media (max-width:820px){.tb-logo{display:inline-block}}
@media (max-width:600px){.hero{background-image:var(--hdr-phone);background-position:center 38%;height:150px}#start .hero{height:160px}}

/* ===== artistic refresh (v1.22): softer surfaces, serif headings, calmer menu. Screen only; print is untouched ===== */
@media screen{
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--sans:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --teal:#2aa89a;--sky:#4a9be6;--ring:0 0 0 4px rgba(74,155,230,.18);--lift:0 2px 4px rgba(13,36,64,.05),0 12px 32px rgba(13,36,64,.08)}
html{scroll-behavior:smooth}
body{font-family:var(--sans);letter-spacing:.005em;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 480px at 100% -8%,rgba(74,155,230,.13),transparent 62%),radial-gradient(760px 420px at -6% 104%,rgba(42,168,154,.10),transparent 60%),#f7f9fc;background-attachment:fixed}
::selection{background:#cfe3f8}
*{scrollbar-width:thin;scrollbar-color:#c5d3e3 transparent}

/* page header */
.topbar{background:rgba(255,255,255,.78);backdrop-filter:blur(10px) saturate(1.2);border-bottom:1px solid rgba(13,36,64,.06);padding:16px 28px}
#crumb{font-family:var(--serif);font-size:19px;color:var(--navy);letter-spacing:.005em}
#crumb .muted{font-family:var(--sans);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#7b8da3}
#crumb b{font-weight:600}
main{padding:28px 28px 48px}
main>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards */
.card{position:relative;border:1px solid rgba(13,36,64,.06);border-radius:20px;padding:22px 24px;box-shadow:var(--lift);background:#fff}
.card::before{content:"";position:absolute;left:24px;top:0;width:44px;height:3px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--accent),var(--teal))}
.card h2{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:0;color:var(--navy);margin:2px 0 8px}
.card h3{font-family:var(--serif);font-weight:600;color:var(--navy)}
.card p.small.muted,.card .blurb{line-height:1.6}
.muted{color:#66788c}

/* controls */
select,input[type=text],input[type=password],input[type=email],input[type=number],input[type=url],input[type=date],input[type=datetime-local],textarea{border-radius:12px;border:1px solid #dbe4ee;background:#fbfdff;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--sky);box-shadow:var(--ring);background:#fff}
label{color:#5f7184;letter-spacing:.02em}
button.btn{border-radius:999px;padding:8px 18px;border:1px solid #d6e0eb;background:#fff;transition:transform .14s,box-shadow .14s,background .14s,border-color .14s}
button.btn:hover:not(:disabled){background:#f1f6fc;border-color:#bcd0e6;transform:translateY(-1px);box-shadow:0 6px 14px rgba(13,36,64,.08)}
button.btn:active:not(:disabled){transform:none;box-shadow:none}
button.btn.primary{background:linear-gradient(135deg,#1b6fc4,#0b5cab 55%,#0a4f95);border-color:transparent;box-shadow:0 6px 16px rgba(11,92,171,.28)}
button.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#2a7fd4,#0f66b8 55%,#0b5aa8);box-shadow:0 10px 22px rgba(11,92,171,.34)}
button.btn.danger{border-color:#f0cfcc;background:#fff8f7}
button.btn.danger:hover:not(:disabled){background:#fdecea;border-color:#e6aaa5}
.toggle input{accent-color:var(--accent)}

/* tables */
.scroll{border:1px solid #e6edf5;border-radius:16px;background:#fff}
table{border-collapse:separate;border-spacing:0}
th{background:linear-gradient(#f8fafd,#f2f6fb);color:#6a7c90;border-bottom:1px solid #e3ebf4;padding:11px 12px}
td{border-bottom:1px solid #eef2f7;padding:10px 12px}
tr:last-child td{border-bottom:0}
tr:hover td{background:#f8fbff}
td:first-child,th:first-child{padding-left:16px}

/* status chips */
.pill{padding:4px 11px 4px 9px;font-weight:600;letter-spacing:.01em}
.pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;opacity:.85}
.tag{border-radius:999px;padding:3px 10px}
.err{border-radius:12px}.appr,.cons,.banner,.warn{border-radius:14px}

/* dashboard tiles + welcome */
.stat{border:1px solid rgba(13,36,64,.05);border-top:0;border-radius:20px;padding:20px 14px;background:linear-gradient(160deg,#ffffff,#f3f8fe);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(74,155,230,.22),transparent 70%)}
.stat:nth-child(2)::after{background:radial-gradient(circle,rgba(27,127,75,.22),transparent 70%)}
.stat:nth-child(3)::after{background:radial-gradient(circle,rgba(194,122,0,.22),transparent 70%)}
.stat:nth-child(4)::after{background:radial-gradient(circle,rgba(179,38,30,.20),transparent 70%)}
.stat::before{display:none}
.stat b{font-family:var(--serif);font-weight:600;font-size:34px}
.card.welcome{background:radial-gradient(500px 220px at 100% 0,rgba(74,155,230,.45),transparent 65%),linear-gradient(120deg,#0d2440,#17508f);overflow:hidden}
.card.welcome::before{display:none}
.card.welcome::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 28px rgba(255,255,255,.04),0 0 0 60px rgba(255,255,255,.03)}
.card.now,.nba{border-radius:20px}
.step{border-radius:16px;border-color:#e6edf5;transition:box-shadow .15s}
.step:hover{box-shadow:0 8px 22px rgba(13,36,64,.07)}

/* sidebar: calmer hierarchy */
#side{background:radial-gradient(420px 260px at 0 0,rgba(74,155,230,.22),transparent 70%),linear-gradient(185deg,#0f2a49,#091b31 70%);box-shadow:6px 0 30px rgba(9,27,49,.12)}
#side .brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.01em}
#side .brand::before{border-radius:14px;background:linear-gradient(135deg,#5aa9ee,#0b5cab 60%,#2aa89a)}
.mh{border-radius:12px;font-weight:600;letter-spacing:.01em;transition:background .15s}
.mg.open>.mh{background:rgba(255,255,255,.07)}
.mi{border-left:1px dashed rgba(255,255,255,.16);margin-left:23px}
.mit{border-radius:10px;transition:background .15s,color .15s,padding .15s}
.mit:hover{padding-left:13px}
.mit.on{background:linear-gradient(90deg,rgba(74,155,230,.38),rgba(74,155,230,.12));box-shadow:inset 2px 0 0 #7cc0ff}
.mit.sh{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;color:#7f9bbd;margin-top:6px;padding:7px 8px}
.mit.sh:hover{color:#fff;padding-left:8px;background:none}
.sg.open>.mit.sh{color:#cfe2f7}
.si{border-left:1px solid rgba(255,255,255,.10);margin-left:8px;padding-left:6px}
#who{background:rgba(255,255,255,.04)}

/* quiet details */
details.card summary{font-family:var(--serif);font-size:16px}
.grp{color:#7b8da3;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){main>*{animation:none}button.btn,.mit{transition:none}html{scroll-behavior:auto}}
@media (max-width:820px){main{padding:18px 14px 40px}.topbar{padding:12px 14px}.card{padding:18px 16px;border-radius:18px}.card::before{left:16px}#crumb{font-size:17px}}
}

/* ===== content size: full width on laptop / MacBook / PC; proportional on iPhone ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}
td,th{overflow-wrap:normal;word-break:normal;hyphens:none}
th,td{min-width:11ch}
td.wrapok,td .wrapok{overflow-wrap:anywhere}
main{max-width:none!important;width:100%;box-sizing:border-box}
@media screen and (min-width:1100px){main{padding:28px clamp(28px,3vw,56px) 56px!important}}
@media screen and (min-width:1700px){main{padding-left:64px!important;padding-right:64px!important}}
.card,.scroll,table{max-width:100%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
img,svg,video,canvas{max-width:100%;height:auto}
@media screen and (max-width:600px){
  html{font-size:15px}
  body{font-size:15px;line-height:1.45}
  /* 16px inputs stop iOS Safari from zooming in when a field is tapped */
  input,select,textarea{font-size:16px!important;max-width:100%;width:100%;box-sizing:border-box;min-height:44px}
  textarea{min-height:88px}
  input[type=checkbox],input[type=radio]{width:auto;min-height:0}
  button.btn,.btn{min-height:44px;font-size:15px;padding:10px 16px}
  main{padding:12px 10px 32px!important}
  .card{padding:16px 14px!important;border-radius:16px;margin-bottom:12px}
  .card h2{font-size:19px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.cols,.fields,.frm{grid-template-columns:1fr!important}
  .row>*{min-width:0;flex:1 1 100%}
  label{font-size:12.5px}
  th,td{padding:9px 10px;font-size:13.5px}
  .stat b{font-size:28px}
  #crumb{font-size:16px}
  .topbar{padding:8px 10px;gap:8px}
  #menuBtn{white-space:nowrap;width:auto;min-height:40px;padding:8px 14px}
  #crumb{flex:1;min-width:0;font-size:14px;line-height:1.25}
  #crumb .muted{font-size:10.5px}
  .hdr-r{flex:none}.hdr-r .pill{white-space:nowrap;padding:3px 9px;font-size:11px}
  .hero{height:84px!important}
}
